  """
  The user's percentile rank based on the requested leaderboard & score. This is
  a number between 0 and 100, 100 being the highest achievable percentile. If
  there are less than 100 records in the target leaderboard, the percentile will return 0.
  """
  projectedPercentile: Float!

  """
  The rank this user is projected to have if they were to achieve the requested
  percentile/score. This is a number between 1 and the total number of records
  in the target leaderboard. If the user's score is not in the top 100, the rank will return 0.
  """
  projectedRank: Float!

  """
  The user's projected score based on the requested leaderboard &
  percentile/rank. This is the minimum score required to achieve the requested
  percentile/rank.
  """
  projectedScore: Float!
